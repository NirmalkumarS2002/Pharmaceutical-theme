<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 - Page Not Found</title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      position: relative;
      background:
        radial-gradient(circle at top left,
          rgba(255, 196, 0, 0.08),
          transparent 35%),

        radial-gradient(circle at bottom right,
          rgba(255, 196, 0, 0.08),
          transparent 35%),

        #000;
    }

    /* FLOATING ICONS */

    .floating-icon {
      position: absolute;
      color: rgba(255, 201, 59, 0.06);
      z-index: 0;
      animation: float 6s ease-in-out infinite;
    }

    .icon1 {
      top: 10%;
      left: 8%;
      font-size: 45px;
    }

    .icon2 {
      bottom: 12%;
      right: 10%;
      font-size: 42px;
      animation-delay: 2s;
    }

    .icon3 {
      top: 55%;
      left: 15%;
      font-size: 35px;
      animation-delay: 1s;
    }

    @keyframes float {

      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-15px);
      }

      100% {
        transform: translateY(0px);
      }

    }

    /* CONTAINER */

    .container {
      width: 100%;
      max-width: 520px;
      background: rgba(10, 10, 10, 0.96);
      border: 1px solid rgba(255, 196, 0, 0.08);
      border-radius: 26px;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      z-index: 1;

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 20px 50px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(255, 196, 0, 0.06);

      backdrop-filter: blur(14px);
    }

    .container::before {

      content: '';

      position: absolute;

      inset: 0;

      border-radius: 26px;

      padding: 1px;

      background: linear-gradient(135deg,
          rgba(255, 196, 0, 0.25),
          transparent,
          rgba(255, 196, 0, 0.12));

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

      -webkit-mask-composite: xor;

      mask-composite: exclude;

      pointer-events: none;
    }

    /* LOGO */

    .logo {
      width: 145px;
      margin-bottom: 20px;
      object-fit: contain;

      filter:
        drop-shadow(0 0 10px rgba(255, 196, 0, 0.15));
    }

    /* 404 */

    .error-code {

      font-size: 5.5rem;

      line-height: 1;

      font-weight: 800;

      color: #f7c948;

      text-shadow:
        0 0 15px rgba(255, 201, 72, 0.35),
        0 0 35px rgba(255, 201, 72, 0.12);

      margin-bottom: 10px;
    }

    .title {

      color: #fff;

      font-size: 1.7rem;

      font-weight: 700;

      margin-bottom: 14px;
    }

    .description {

      color: #9d9d9d;

      font-size: 0.92rem;

      line-height: 1.7;

      max-width: 420px;

      margin: 0 auto 28px;
    }

    /* BUTTONS */

    .buttons {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 14px;

      flex-wrap: wrap;
    }

    .btn {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      border: none;

      outline: none;

      cursor: pointer;

      padding: 13px 20px;

      border-radius: 14px;

      min-width: 180px;

      font-size: 0.92rem;

      font-weight: 600;

      transition: 0.35s ease;

      font-family: inherit;
    }

    .btn i {
      font-size: 0.9rem;
    }

    /* PRIMARY */

    .btn-primary {

      background: #f7c948;

      color: #000;

      box-shadow:
        0 0 20px rgba(247, 201, 72, 0.22);
    }

    .btn-primary:hover {

      transform: translateY(-3px);

      box-shadow:
        0 0 30px rgba(247, 201, 72, 0.35);
    }

    /* SECONDARY */

    .btn-secondary {

      background: rgba(255, 255, 255, 0.03);

      border: 1px solid rgba(255, 255, 255, 0.08);

      color: #fff;
    }

    .btn-secondary:hover {

      background: rgba(255, 255, 255, 0.08);

      transform: translateY(-3px);
    }

    /* MOBILE */

    @media (max-width:480px) {

      body {
        padding: 15px;
      }

      .container {

        padding: 30px 18px;

        border-radius: 22px;
      }

      .logo {
        width: 120px;
      }

      .error-code {
        font-size: 4rem;
      }

      .title {
        font-size: 1.35rem;
      }

      .description {

        font-size: 0.88rem;

        margin-bottom: 24px;
      }

      .buttons {

        flex-direction: column;

        gap: 12px;
      }

      .btn {

        width: 100%;

        min-width: 100%;
      }

      .icon1 {
        font-size: 30px;
      }

      .icon2 {
        font-size: 30px;
      }

      .icon3 {
        font-size: 24px;
      }

    }
  </style>
</head>

<body>

  <!-- FLOATING ICONS -->

  <i class="fa-solid fa-scale-balanced floating-icon icon1"></i>

  <i class="fa-solid fa-gavel floating-icon icon2"></i>

  <i class="fa-solid fa-book floating-icon icon3"></i>

  <!-- CONTAINER -->

  <div class="container">

    <!-- LOGO -->

    <img src="./src/logo.webp"
      alt="Logo"
      class="logo">

    <!-- 404 -->

    <h1 class="error-code">404</h1>

    <!-- TITLE -->

    <h2 class="title">
      Page Not Found
    </h2>

    <!-- DESCRIPTION -->

    <p class="description">

      The legal page you are trying to access may have been moved,
      removed, or temporarily unavailable.

      Please return to the dashboard or continue browsing
      our legal services.

    </p>

    <!-- BUTTONS -->

    <div class="buttons">

      <button type="button"
        class="btn btn-primary"
        onclick="goDashboard()">

        <i class="fa-solid fa-house"></i>

        Back To Dashboard

      </button>

      <button type="button"
        class="btn btn-secondary"
        onclick="goBackPage()">

        <i class="fa-solid fa-arrow-left"></i>

        Go Back

      </button>

    </div>

  </div>

  <script>

    function goDashboard() {

      window.location.href = "index.html";

    }

    function goBackPage() {

      history.back();

    }

  </script>

</body>

</html>
